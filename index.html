<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNI EASE - امنی ایز</title>
<meta name="theme-color" content="#105b38">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
--primary: #105b38;
--accent: #d4af37;
--bg: #f8f9fa;
--text: #212529;
--card-bg: #ffffff;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background-color: var(--bg);
color: var(--text);
line-height: 1.6;
padding-bottom: 40px;
}
header {
background: linear-gradient(135deg, #105b38, #0a3a24);
color: white;
padding: 15px 20px;
text-align: center;
box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
header h1 {
font-size: 24px;
color: var(--accent);
}
header p {
font-size: 13px;
opacity: 0.9;
}
nav {
display: flex;
overflow-x: auto;
background: #ffffff;
border-bottom: 2px solid var(--accent);
position: sticky;
top: 0;
z-index: 100;
white-space: nowrap;
}
nav button {
background: none;
border: none;
padding: 12px 15px;
font-weight: bold;
color: var(--text);
cursor: pointer;
font-size: 13px;
transition: 0.3s;
flex-shrink: 0;
}
nav button.active {
color: var(--primary);
border-bottom: 3px solid var(--primary);
background-color: #f0f7f3;
}
.container {
padding: 15px;
max-width: 800px;
margin: 0 auto;
}
.tab-content {
display: none;
}
.tab-content.active {
display: block;
}
.card {
background: var(--card-bg);
border-radius: 10px;
padding: 15px;
margin-bottom: 15px;
box-shadow: 0 2px 8px rgba(0,0,0,0.05);
border-right: 4px solid var(--primary);
}
.btn {
display: inline-block;
background: var(--primary);
color: white;
padding: 10px 18px;
border-radius: 5px;
text-decoration: none;
border: none;
cursor: pointer;
font-size: 15px;
margin-top: 8px;
width: 100%;
font-weight: bold;
}
.btn-accent {
background: var(--accent);
color: #000;
}
input, select, textarea {
width: 100%;
padding: 10px;
margin: 8px 0;
border: 1px solid #ccc;
border-radius: 5px;
font-size: 14px;
}
.quran-text {
font-size: 24px;
text-align: right;
line-height: 2.2;
color: #105b38;
margin-bottom: 15px;
direction: rtl;
}
.translation-text {
font-size: 16px;
color: #333;
text-align: right;
line-height: 1.8;
direction: rtl;
}
.verse-box {
background: #fdfdfd;
border: 1px solid #e2e8f0;
padding: 12px;
margin-bottom: 10px;
border-radius: 8px;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
}
table, th, td {
border: 1px solid #ddd;
padding: 8px;
text-align: center;
font-size: 13px;
}
th {
background-color: var(--primary);
color: white;
}
.brand-footer {
text-align: center;
margin-top: 30px;
padding: 15px;
background: #e9f0ec;
border-radius: 8px;
border: 1px solid #cce0d5;
}
.brand-footer h3 {
color: var(--primary);
font-size: 16px;
}
.brand-footer p {
font-size: 13px;
color: #555;
}
#map {
height: 250px;
border-radius: 8px;
margin-top: 10px;
}
</style>
</head>
<body>
<header>
<h1>☀ OMNI EASE - امنی ایز ☀</h1>
<p>آپ کا اپنا ڈیجیٹل، بزنس اور روحانی مرکز</p>
</header>
<nav>
<button class="active" onclick="openTab('quran', this)">📖 قرآن پاک</button>
<button onclick="openTab('library', this)">📚 کتب خانہ (حدیث و فقہ)</button>
<button onclick="openTab('calendar', this)">📅 کیلنڈر</button>
<button onclick="openTab('ledger', this)">📒 روزنامچہ / لیجر</button>
<button onclick="openTab('translator', this)">🌐 ترجمہ و آواز</button>
<button onclick="openTab('poster', this)">🎨 پوسٹر میکر</button>
<button onclick="openTab('map-sec', this)">🗺️ لوکیشن و میپ</button>
</nav>
<div class="container">
<!-- 1. QURAN MODULE -->
<div id="quran" class="tab-content active">
<div class="card">
<h3>📖 قرآن مجید و عالمی تراجم</h3>
<label>سورت کا انتخاب کریں:</label>
<select id="surahSelect">
<option value="1">1. الفاتحة</option>
<option value="2">2. البقرة</option>
<option value="36">36. يس</option>
<option value="55">55. الرحمن</option>
<option value="67">67. الملك</option>
<option value="112">112. الإخلاص</option>
<option value="113">113. الفلق</option>
<option value="114">114. الناس</option>
</select>
<label>زبان اور مترجم منتخب کریں:</label>
<select id="langSelect">
<option value="ur.jalandhry">اردو - فتح محمد جالندھری</option>
<option value="ur.junagarhi">اردو - مولانا جوناگڑھی</option>
<option value="en.sahih">English - Sahih International</option>
<option value="ps.abdulwali">پشتو - عبدالولی</option>
<option value="sd.amrooti">سندھی - تاج محمود امروٹی</option>
<option value="ar.jalalayn">عربی - تفسير الجلالين</option>
</select>
<button class="btn" onclick="fetchSurahData()">لوڈ کریں</button>
</div>
<div id="quranDisplay" class="card" style="display:none;">
<div id="quranContainer"></div>
</div>
</div>
<!-- 2. ISLAMIC LIBRARY (HADITH & FIQH) -->
<div id="library" class="tab-content">
<div class="card">
<h3>📚 اسلامی کتب خانہ (حدیث و فقہ)</h3>
<p>صحاح ستہ اور تمام مکاتبِ فکر کی فقہی کتب کا جامع فریم ورک</p>
<select id="bookSelect">
<option value="bukhari">صحیح بخاری</option>
<option value="muslim">صحیح مسلم</option>
<option value="tirmidhi">جامع ترمذی</option>
<option value="abudawud">سنن ابو داؤد</option>
<option value="nasai">سنن نسائی</option>
<option value="ibnmajah">سنن ابن ماجہ</option>
<option value="fiqh_hanafi">فقہ حنفی (ہدایہ / فتاویٰ عالمگیری)</option>
<option value="fiqh_jafari">فقہ جعفری (شرائع الاسلام)</option>
<option value="fiqh_shafii">فقہ شافعی / مالکی / حنبلی</option>
</select>
<input type="text" id="hadithSearch" placeholder="حدیث نمبر یا تلاش کا لفظ درج کریں...">
<button class="btn btn-accent" onclick="searchLibrary()">کتاب میں تلاش کریں</button>
<div id="libraryResult" style="margin-top:10px; font-size: 14px; color:#333;"></div>
</div>
</div>
<!-- 3. CALENDAR MODULE -->
<div id="calendar" class="tab-content">
<div class="card">
<h3>📅 اسلامی و عیسوی کیلنڈر</h3>
<div id="calendarBox" style="font-size: 16px; font-weight: bold; text-align: center; color: var(--primary);">
تاریخ لوڈ ہو رہی ہے...
</div>
</div>
</div>
<!-- 4. LEDGER / ROZNAMCHA MODULE -->
<div id="ledger" class="tab-content">
<div class="card">
<h3>📒 روزنامچہ / ڈیجیٹل لیجر</h3>
<input type="text" id="itemName" placeholder="تفصیل / آئٹم کا نام">
<input type="number" id="itemQty" placeholder="تعداد / مقدار">
<input type="number" id="itemAmount" placeholder="رقم (روپے)">
<div style="display:flex; gap:10px;">
<button class="btn" style="flex:1;" onclick="addLedgerEntry('income')">آمدن (+)</button>
<button class="btn" style="flex:1; background:#c0392b;" onclick="addLedgerEntry('expense')">خرچ (-)</button>
</div>
<h4 style="margin-top:15px;">کل بقایا: <span id="totalBalance">0</span> روپے</h4>
<table>
<thead>
<tr>
<th>تفصیل</th>
<th>مقدار</th>
<th>رقم</th>
</tr>
</thead>
<tbody id="ledgerTable"></tbody>
</table>
</div>
  </div>
