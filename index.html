<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNI EASE</title>
<style>
/* پورے پیج کا خوبصورت بیک گراؤنڈ */
body {
background-color: #f0f4f8;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
color: #2c3e50;
margin: 0;
padding: 20px;
text-align: center;
}
/* مین نام (Title) */
h1 {
color: #1a252f;
font-size: 2.2rem;
margin-bottom: 5px;
}
h1 {
color: #1b4f72 !important;
font-size: 2.5rem !important;
font-weight: bold !important;
text-shadow: 1px 1px 2px rgba(0,0,0,0.15) !important;
margin-bottom: 5px !important;
  * سب ٹائٹل */
.subtitle {
color: #7f8c8d;
font-size: 1.1rem;
margin-bottom: 25px;
}
/* بٹنوں کا باکس */
.buttons-container {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 10px;
margin-bottom: 30px;
}
/* ہر بٹن کا خوبصورت اسٹائل */
.btn {
color: white;
border: none;
padding: 12px 18px;
border-radius: 8px;
font-size: 0.95rem;
font-weight: bold;
cursor: pointer;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
transition: all 0.2s ease;
}
.btn:hover {
transform: translateY(-2px);
box-shadow: 0 6px 10px rgba(0,0,0,0.15);
}
/* تمام بٹنوں کے الگ الگ مخصوص رنگ */
.btn-islamic { background: linear-gradient(135deg, #2ecc71, #27ae60); }
.btn-quran { background: linear-gradient(135deg, #16a085, #1abc9c); }
.btn-ledger { background: linear-gradient(135deg, #f39c12, #d35400); }
.btn-ad { background: linear-gradient(135deg, #e67e22, #d35400); }
.btn-video { background: linear-gradient(135deg, #e74c3c, #c0392b); }
.btn-word { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
/* کارڈز / وائٹ باکس کا ڈیزائن */
.card {
background: white;
border-radius: 12px;
padding: 25px;
max-width: 600px;
margin: 0 auto 20px auto;
box-shadow: 0 4px 15px rgba(0,0,0,0.05);
border-top: 5px solid #2ecc71;
}
.card h2 {
color: #27ae60;
margin-top: 0;
}
blockquote {
font-style: italic;
color: #34495e;
background: #eef9f1;
padding: 12px;
border-left: 4px solid #2ecc71;
border-radius: 4px;
margin: 15px 0;
}
textarea {
width: 90%;
height: 80px;
border: 1px solid #bdc3c7;
border-radius: 6px;
padding: 10px;
font-family: inherit;
resize: vertical;
}
.save-btn {
background-color: #27ae60;
color: white;
border: none;
padding: 8px 20px;
border-radius: 5px;
margin-top: 10px;
cursor: pointer;
font-weight: bold;
}
</style>
</head>
<body>
<h1>🌟 OMNI EASE 🌟</h1>
<div class="subtitle">Your own all-in-one digital, business, and spiritual hub</div>
<!-- تمام الگ الگ رنگین بٹنز -->
<div class="buttons-container">
<button class="btn btn-islamic" onclick="buttonAction('Islamic Calendar')">📅 Islamic Calendar</button>
<button class="btn btn-quran" onclick="buttonAction('Holy Quran')">📖 Holy Quran</button>
<button class="btn btn-ledger" onclick="buttonAction('Shop Ledger')">📊 Shop Ledger</button>
<button class="btn btn-ad" onclick="buttonAction('Ad Designer')">🎨 Ad Designer</button>
<button class="btn btn-video" onclick="buttonAction('Video Maker')">🎥 Video Maker</button>
<button class="btn btn-word" onclick="buttonAction('Word counter')">✏️ Word counter</button>
</div>
<!-- اسلامی و روحانی سیکشن -->
<div class="card">
<h2>📖 The Holy Quran and Spiritual Guidance</h2>
<p>Daily recitation, selected surahs and a source of inspired peace.</p>
<p><strong>In the name of Allah, the Merciful</strong></p>
<blockquote>
"Indeed, in the remembrance of Allah do hearts find rest." (Ar-Ra'd: 28)
</blockquote>
<label for="surah-note"><strong>Surah or verse selection / note:</strong></label>


<textarea id="surah-note" placeholder="Save the translation of the verse or surah here..."></textarea>

<button class="save-btn" onclick="buttonAction('Note Saved')">Save</button>
</div>
<script>
function buttonAction(name) {
alert(name + " clicked!");
}
</script>
</body>
</html>
